name: build-windows

# Builds the Windows x64 (baseline) OpenCode CLI from this branch on a standard GitHub-hosted runner.
# Mirrors windows-desktop-unsigned, but compiles the CLI from source instead of bundling the published package.

on:
  push:
    branches: [http-proxy]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      OPENCODE_CHANNEL: prod
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744 # v3.6.0

      - uses: ./.github/actions/setup-bun

      - name: Build CLI
        run: bun packages/cli/script/build.ts --target=opencode-windows-x64-baseline

      - name: Show the build
        working-directory: packages/cli/dist
        run: |
          ls
          ls -la cli-windows-x64-baseline/bin

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: opencode-cli-windows-x64-baseline
          path: packages/cli/dist/cli-windows-x64-baseline
          if-no-files-found: error
